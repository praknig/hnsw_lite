# Continuous integration for hnsw-lite.
#
# Runs on every pull request into master (including each new push to it), on
# every push to master, and manually from the Actions tab ("Run workflow").
# A newer run for the same branch cancels an older one still in progress.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every ctest call runs four entries at a time (GitHub's runners have 2 to 4
  # cores; the heaviest groups are split into shards that start first).
  CTEST_PARALLEL_LEVEL: 4

jobs:
  # Which kinds of files changed? Builds and tests run only when code changed;
  # the documentation check runs only when documentation changed. A job skipped
  # this way counts as passed, so documentation-only pull requests can merge.
  # Manual runs, first pushes of a branch and unknown bases run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history is needed to find the merge base

      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) bash .github/scripts/classify_changes.sh "$PR_BASE" "$PR_HEAD" ;;
            push) bash .github/scripts/classify_changes.sh "$PUSH_BEFORE" "$GITHUB_SHA" ;;
            *) printf 'code=true\ndocs=true\n' ;;
          esac | tee -a "$GITHUB_OUTPUT"

  # Documentation: every relative link and anchor in every Markdown file.
  docs:
    name: Documentation links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check links and anchors
        run: python3 .github/scripts/check_links.py

  # Release build and full test suite on every major platform and compiler.
  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # one failing platform must not hide results from the others
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-24.04
            cxx: g++
          - name: Linux / Clang
            os: ubuntu-24.04
            cxx: clang++
          - name: macOS ARM / Apple Clang (NEON)
            os: macos-14
            cxx: clang++
          - name: Windows / MSVC
            os: windows-2022
            cxx: ""  # use the default Visual Studio generator and compiler
          # ARM with GCC and libstdc++ (macOS covers ARM only with Apple's compiler and libc++).
          - name: Linux ARM64 / GCC (NEON)
            os: ubuntu-24.04-arm
            cxx: g++
          # libc++ (macOS's standard library) on Linux: catches library differences
          # quickly, such as the saved-file portability bug found in this way.
          - name: Linux / Clang + libc++
            os: ubuntu-24.04
            cxx: clang++
            packages: libc++-dev libc++abi-dev
            cmake_args: '"-DCMAKE_CXX_FLAGS=-stdlib=libc++" "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -lc++abi"'
          # The oldest compilers the README promises to support.
          - name: Linux / GCC 11 (oldest supported)
            os: ubuntu-22.04
            cxx: g++-11
          - name: Linux / Clang 14 (oldest supported)
            os: ubuntu-22.04
            cxx: clang++-14
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Show compiler and CPU
        shell: bash
        run: |
          echo "Runner: $RUNNER_OS $(uname -m)"
          if [ -n "$CXX" ]; then $CXX --version; fi

      - name: Install packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Benchmarks (smoke test)
        if: matrix.name == 'Linux / GCC'
        run: |
          ./build/bench_distance
          ./build/bench_search

  # Older x86 CPUs, emulated with QEMU. GitHub's machines all support AVX2 or
  # better, so without this the plain C++ distance code never runs in CI. The
  # build uses runtime dispatch (no -march), so the same binary runs on both.
  emulated-cpus:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux / emulated ${{ matrix.cpu }} (${{ matrix.kernel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: Nehalem  # no AVX at all
            qemu_cpu: Nehalem
            kernel: plain C++ kernels
          # AVX2 without AVX-512. Haswell's TSX (hle, rtm) is switched off: QEMU
          # cannot emulate it and warns at every thread start, burying the output;
          # hnsw-lite does not use it.
          - cpu: Haswell
            qemu_cpu: Haswell,-hle,-rtm
            kernel: AVX2 kernels
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHNSW_LITE_BUILD_BENCHMARKS=OFF -DHNSW_LITE_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      # Emulation is slow, so the two exhaustive file-corruption sweeps and the
      # long-running stress group are left to the native jobs.
      - name: Test on the emulated CPU
        # CTest's own entries (shards included, read from `ctest -N -V`, so they
        # follow CMakeLists.txt), each under QEMU, four at a time, sharded entries
        # first; stress is left out. Any failure fails the step.
        run: |
          ctest --test-dir build -N -V | sed -n 's/^[0-9]*: Test command: [^ ]* //p' | tr -d '"' |
            grep -vx -- '--group stress' |
            awk '/--shard/ {print; next} {rest = rest $0 "\n"} END {printf "%s", rest}' |
            xargs -P 4 -L 1 qemu-x86_64 -cpu ${{ matrix.qemu_cpu }} ./build/test_comprehensive --exclude p20_ --exclude p21_

  # The toolchain used for local development on Windows (MinGW-w64 GCC).
  windows-mingw:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Windows / MinGW GCC
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Memory errors and undefined behavior. The out-of-memory tests report SKIP
  # here, because AddressSanitizer installs its own allocator.
  address-sanitizer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DHNSW_LITE_SANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # The 36 groups are independent CTest tests: four at a time on the
        # runner's 4 cores (one at a time took over 30 minutes in this build).
        run: ctest --test-dir build --output-on-failure -j 4

  # Line and branch coverage of the library. Measured: 100% of lines, about
  # 98% of branches; the remaining branches are compiler-generated (inside
  # initializer lists and standard-library code), so the branch gate leaves a
  # one-point margin. --merge-lines combines template instantiations.
  # Line and branch coverage of the library. Fails if coverage drops, and
  # uploads a browsable HTML report. Atomic counters keep the counts exact
  # while the concurrency tests run several threads.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=--coverage -O0 -fno-inline -fprofile-update=atomic"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build --parallel --target test_comprehensive

      - name: Test
        # Four groups at a time; GCC locks .gcda files while merging, so parallel
        # processes add up their counts correctly.
        run: ctest --test-dir build --output-on-failure -j 4

      - name: Coverage report
        run: |
          mkdir -p coverage
          # A SIMD kernel can only run on a CPU that supports it, so kernels this
          # runner cannot execute are excluded (GitHub's runners usually lack
          # AVX-512). They are still tested wherever the hardware supports them.
          SKIP_KERNELS=""
          for isa in avx512f avx2; do
            if ! grep -qw "$isa" /proc/cpuinfo; then
              file="src/distance_${isa%f}.cpp"
              echo "This runner's CPU has no $isa: excluding $file from coverage"
              SKIP_KERNELS="$SKIP_KERNELS --exclude $PWD/$file"
            fi
          done
          # Hit counts above 2^32 are real here (the distance kernels run billions of
          # times), not gcov bug 68080's garbage (near 2^64): gcovr's suspicious-hit
          # check is kept, with its threshold raised to 2^40.
          gcovr -r . build \
            --filter "$PWD/include/" --filter "$PWD/src/" --exclude "$PWD/src/distance_neon.cpp" $SKIP_KERNELS \
            --exclude-unreachable-branches --exclude-throw-branches \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file --merge-lines \
            --gcov-suspicious-hits-threshold 1099511627776 \
            -j 4 \
            --print-summary --html-details coverage/index.html \
            --fail-under-line 99 --fail-under-branch 97

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Data races in the threaded groups, plus deletion (which future concurrent writes will share).
  thread-sanitizer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Linux / ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Allow ThreadSanitizer on this kernel
        # Newer kernels randomize memory addresses more than TSan supports.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

      - name: Build
        run: cmake --build build --parallel --target test_comprehensive

      - name: Test threaded groups
        # The threaded groups (14), four at a time.
        run: ctest --test-dir build --output-on-failure -j 4 -R '^comprehensive\.(concurrency|helpers|deletion|add_batch|codec|sq8|matryoshka|lean|review|codes_only|binary|pq|ivf|disk|health|upkeep|rebuild)(\..*)?$'

  # The one check to require in branch protection: passes when every job that
  # ran succeeded (jobs skipped because nothing relevant changed are fine).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, docs, build-and-test, emulated-cpus, windows-mingw, address-sanitizer, coverage, thread-sanitizer]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job that ran succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "A job failed or was cancelled."
            exit 1
          fi